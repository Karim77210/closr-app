name: closr_app
description: A messaging app where creators monetize 1-on-1 conversations with paid subscribers.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.1.6
  provider: ^6.1.0
  firebase_storage: ^11.0.0
  image_picker: ^1.0.4
  uuid: ^4.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.0
  http: ^1.2.0
  video_player: ^2.8.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.2.1
  sign_in_button: ^5.0.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

